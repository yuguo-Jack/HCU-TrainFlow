[build-system]
requires = ["setuptools>=69.5"]
build-backend = "setuptools.build_meta"

[project]
name = "hcu-trainflow"
version = "0.7.0"
description = "An agentic workflow for end-to-end large-model training adaptation, optimization, and resilient scaling on HCU."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "setuptools>=69.5"]

[project.scripts]
hcu-trainflow = "hcu_trainflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
