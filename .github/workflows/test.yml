name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
        run: python scripts/ci_scope.py
  verify:
    needs: scope
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python scripts/validate_knowledge.py
      - run: python scripts/check_wiki_coverage.py
      - run: python scripts/check_skill_resources.py
      - run: python scripts/check_documentation.py
      - if: needs.scope.outputs.full != 'true'
        shell: bash
        run: python -m pytest -q $(python scripts/ci_scope.py --test-targets)
  tests:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: hcu-trainflow demo .work/ci-demo
      - run: hcu-trainflow collaboration-demo .work/ci-collaboration
  summary:
    name: CI result
    if: always()
    needs: [scope, verify, tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MATRIX_RESULT: ${{ needs.tests.result }}
          FULL_MATRIX: ${{ needs.scope.outputs.full }}
        run: |
          python - <<'PY'
          import os, sys
          scope, verify, matrix = (os.environ[key] for key in ['SCOPE_RESULT', 'VERIFY_RESULT', 'MATRIX_RESULT'])
          full = os.environ['FULL_MATRIX'] == 'true'
          ok = scope == verify == 'success' and (matrix == 'success' if full else matrix in {'success', 'skipped'})
          print({'scope': scope, 'verification': verify, 'matrix': matrix, 'full_matrix': full})
          sys.exit(0 if ok else 1)
          PY
